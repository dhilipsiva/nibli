[package]
name = "nibli-semantics"
description = "Semantic compiler — flat AST buffer to First-Order Logic IR"
version.workspace = true
rust-version.workspace = true
edition = "2024"
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
lasso = "0.7.3"
nibli-types = { workspace = true }
# Single source of predicate arities (also drives back-translation + logji's
# SignatureSource). smuni delegates instead of generating a parallel arity map.
nibli-lexicon = { workspace = true }

[lib]
crate-type = ["lib"]
