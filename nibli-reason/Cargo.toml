[package]
name = "nibli-reason"
description = "Reasoning engine — backward-chaining inference over typed fact store"
version.workspace = true
rust-version.workspace = true
edition = "2024"
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
nibli-types = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
nibli-lexicon = { workspace = true }

[features]
default = []
serde = ["dep:serde"]

# Test-only: the real nibli-kr→smuni front-end, so unit tests can build a `LogicBuffer`
# the SHIPPED way (event-decomposed) and check the flat helpers against it. No cycle —
# nibli-kr→smuni→logji is a DAG; dev-deps never touch the WASM/release build.
# PATH-ONLY internal dev-deps (see nibli-kr/Cargo.toml): stripped at publish,
# so they impose no publish-order constraint.
[dev-dependencies]
nibli-kr = { path = "../nibli-kr" }
nibli-semantics = { path = "../nibli-semantics" }

[lib]
crate-type = ["lib"]
