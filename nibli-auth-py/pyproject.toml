[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "nibli-auth-native"
# Version comes from Cargo.toml (version.workspace = true) so the wheel rides
# the workspace lockstep — a static value here would silently diverge on the
# first [workspace.package] bump.
dynamic = ["version"]
description = "Native PyO3 extension for nibli-auth (thread-local warm Authorizer)"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "nibli_auth_native"
features = ["extension-module"]
