[package]
name = "nibli-auth-py"
description = "PyO3 bindings for nibli-auth (module: nibli_auth_native)"
version.workspace = true
rust-version.workspace = true
edition = "2024"
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "nibli_auth_native"
crate-type = ["cdylib"]

[dependencies]
nibli-auth = { workspace = true }
pyo3 = { version = "0.24", features = ["extension-module"] }
