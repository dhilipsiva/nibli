[package]
name = "nibli-kr"
description = "The nibli KR surface-syntax front-end — pest grammar, validating emit, render"
version.workspace = true
rust-version.workspace = true
edition = "2024"
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# Console surfaces (nibli-host, nibli REPL): reedline Completer adapter over
# the pure [`complete`] engine. UI / wasm leave this off.
reedline = ["dep:reedline"]

[dependencies]
pest = "2"
pest_derive = "2"
# resolve.rs: the alias map (name -> gismu + swap + place labels) and the
# identity-gismu passthrough arity source, both from nibli-lexicon. The grammar's
# kw_* rules are pinned against its single-source RESERVED_WORDS by an exhaustive
# unit test.
nibli-lexicon = { workspace = true }
# emit.rs targets nibli-types' AstBuffer; parse_checked returns NibliError.
nibli-types = { workspace = true }
reedline = { version = "0.45.0", optional = true }

[dev-dependencies]
# Golden tests: every emitted buffer must be accepted by smuni, and nibli KR
# statements must compile to LogicBuffers EQUAL to their Lojban twins'
# (the in-crate preview of the nibli-verify translation battery).
# PATH-ONLY on purpose (not workspace = true): a versionless path dev-dep is
# STRIPPED from the published manifest, while a workspace-inherited one keeps
# its version and becomes a registry dep that must already exist on crates.io
# — which would make the publish order depend on dev edges (kr before
# semantics fails). Applies to every INTERNAL dev-dep below and in
# nibli-reason / nibli-render / nibli-engine.
nibli-semantics = { path = "../nibli-semantics" }
