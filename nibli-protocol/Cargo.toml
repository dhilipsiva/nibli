[package]
name = "nibli-protocol"
description = "Shared wire-format proof-trace types and the JSON helpers"
version.workspace = true
rust-version.workspace = true
edition = "2024"
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `serde` feature so the re-exported proof types (`ProofRule`/`ProofStep`/
# `ProofTrace`/`LogicalTerm`) derive Serialize/Deserialize for the wire JSON.
nibli-types = { workspace = true, features = ["serde"] }

[features]
# The native TCP compute-backend client (std::net::TcpStream). OFF by default so
# the wasm32-unknown-unknown browser build (nibli-ui / nibli-wasm) never pulls in
# std::net. Native consumers (gasnu, nibli-engine) enable it explicitly.
compute-client = []
