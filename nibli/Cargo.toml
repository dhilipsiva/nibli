[package]
name = "nibli"
description = "Native debug REPL and validation tooling"
version.workspace = true
edition = "2024"
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
nibli-kr = { workspace = true, features = ["reedline"] }
nibli-engine = { workspace = true }
nibli-import = { workspace = true }
nibli-render = { workspace = true }
reedline = "0.45.0"
nu-ansi-term = "0.50"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# REPO-ONLY: the bench bins `include_str!` the shipped corpora from the repo
# root (../../../utopia.nibli, gdpr.nibli), which cannot exist inside a
# published package tarball — `cargo package` verification failed on exactly
# that. Off by default so packaging/publishing skips the bins entirely
# (`required-features` below); the Justfile bench recipes enable it. Enabling
# this feature on the crates.io tarball will NOT build — run the benches from
# a repo checkout.
bench-bins = ["dep:serde", "dep:serde_json"]

# (No per-target `description` keys: cargo has no such field and warned
# `unused manifest key` on every invocation while they were here.)
[[bin]]
name = "nibli"
path = "src/main.rs"

# nibli-validate: validation / data-generation CLI
[[bin]]
name = "nibli-validate"
path = "src/bin/validate.rs"

# nibli-import: RDF Turtle / OWL import CLI. `doc = false`: the bin shares its
# rustdoc output path with the `nibli-import` LIBRARY it wraps, and cargo doc
# warned about the filename collision (nondeterministic clobber).
[[bin]]
name = "nibli-import"
path = "src/bin/import.rs"
doc = false

# nibli-pin: native pin runner for KB-level behavioural gates
[[bin]]
name = "nibli-pin"
path = "src/bin/pin.rs"

# nibli-bench-book: release-profile timing pins for the book's quoted figures
[[bin]]
name = "nibli-bench-book"
path = "src/bin/bench_book.rs"
required-features = ["bench-bins"]

# nibli-bench-naf: release-profile timing for negation-as-failure evaluation
[[bin]]
name = "nibli-bench-naf"
path = "src/bin/bench_naf.rs"
required-features = ["bench-bins"]

# nibli-bench-closure: release-profile timing for recursive rule evaluation (the
# transitive-closure cost cliff). Unlike its two siblings this bin generates its
# own knowledge bases and `include_str!`s nothing, so the tarball argument above
# does not apply to it — it stays behind `bench-bins` because a bench bin is
# repo-only dev tooling and has no business in a published package.
[[bin]]
name = "nibli-bench-closure"
path = "src/bin/bench_closure.rs"
required-features = ["bench-bins"]

# Private research driver; reads the frozen paper protocol's JSON workloads.
[[bin]]
name = "nibli-bench-paper"
path = "src/bin/bench_paper.rs"
required-features = ["bench-bins"]
