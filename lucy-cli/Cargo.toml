[package]
name = "lucy-cli"
description = "Lucy D: a persistent identity whose memory is plain nibli text, loaded by whatever agent session runs her"
version.workspace = true
rust-version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Tier Z (RELEASING.md): repo-only and shipped as a release binary, not a crate.
publish = false

[[bin]]
name = "lucy"
path = "src/main.rs"

[dependencies]
nibli-engine = { workspace = true }
nibli-types = { workspace = true, features = ["serde"] }
nibli-protocol = { workspace = true }
nibli-render = { workspace = true }
nibli-kr = { workspace = true }
nibli-lexicon = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "2"
sha2 = "0.10"
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
base64 = "0.22"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["socket", "user", "signal", "process", "term"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.10", optional = true }

[features]
desktop-ui = ["dep:gtk4"]

[dev-dependencies]
tempfile = "3"
