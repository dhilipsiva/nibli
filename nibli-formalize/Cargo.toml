[package]
name = "nibli-formalize"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Agentic English-to-KR formalizer: LLM + validation gates + self-correction loop"
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

# Pure-logic engine consumed by nibli-ui. The KR compiler/assertability gates
# and agent/provider logic build + unit-test natively with mocked chat(); only
# the concrete browser HTTP transport is wasm-specific. No Dioxus here — the
# UI shell is nibli-ui's job.

[dependencies]
nibli-kr = { workspace = true }
nibli-semantics = { workspace = true }
nibli-render = { workspace = true }
nibli-reason = { workspace = true }
nibli-types = { workspace = true }
# The shipped alias map (ALIASES) — the LLM system prompt grounds on it so the
# model uses valid predicate names. Transitive via nibli-kr, but named directly
# to reach the public statics.
nibli-lexicon = { workspace = true }
serde_json = "1"

[dev-dependencies]
# A minimal block_on for driving the async agent loop in native unit tests.
futures = { version = "0.3", features = ["executor"] }

# Browser fetch — compiled only for the wasm target (the concrete `Chat`
# transport). Native tests use a mock, so the pure logic stays offline-testable.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", features = ["http"] }
