[[obligation]]
id = "scc_stack"
sources = ["nibli-reason/src/dependency_graph.rs", "nibli-verify/spec/nibli_checker.nibli"]
contract = """Production component removal terminates at the topmost active root,
returns exactly the reversed active suffix, and preserves state entries except
the emitted members' stack flags. Explicit ordered-stack and frontier conditions
justify maximal SCC emission and completed-set closure. Local contracts cover
discovery, visited edges, completion, and exit. The production allocation prefix
establishes the DFS invariant; it implies single-step safety and root readiness,
and every inner DFS branch preserves it. Nonroot completion merges the child's
active interval into its parent's; root completion preserves the invariant while
emitting a maximal SCC. A lexicographic measure proves that the production inner
DFS loop terminates from an invariant state with both logical stacks empty and
preserves every discovered vertex. Fresh-root initialization and the outer scan
preserve the invariant and advance coverage. The complete production indexed
kernel terminates and returns nonempty valid maximal SCCs, with every graph
vertex appearing exactly once, assuming only in-bounds edge targets. Its output
contains an internal negative edge exactly when the inductive Horn closure
criterion derives a negative self-path. A conservative text check detects source
drift in the modeled checker fragment. The predicate-name adapter, native
negative-edge scan and evaluator refinement remain separate obligations."""
probes = ["scc_kernel"]
tests = ["nibli-reason/src/dependency_graph.rs", "nibli-reason/src/rules.rs"]
theorem_files = [
  "proofs/self-check/SccGraph.lean", "proofs/self-check/SccKernelProofs.lean",
  "proofs/self-check/SccInvariant.lean", "proofs/self-check/SccTermination.lean",
  "proofs/self-check/SccTraversal.lean", "proofs/self-check/SccCriterion.lean",
]
theorems = [
  "NibliSelfCheck.Scc.reach_closed", "NibliSelfCheck.Scc.seal_component",
  "NibliSelfCheck.Scc.rank_suffix_membership", "NibliSelfCheck.Scc.scc_of_same_members",
  "NibliSelfCheck.Scc.rank_prefix_membership", "NibliSelfCheck.Scc.root_frontier_scc",
  "NibliSelfCheck.Scc.root_frontier_closed",
  "NibliSelfCheck.Scc.pop_done", "NibliSelfCheck.Scc.pop_step",
  "NibliSelfCheck.Scc.pop_component_total", "NibliSelfCheck.Scc.pop_component_scc",
  "NibliSelfCheck.Scc.dfs_done", "NibliSelfCheck.Scc.dfs_discover_step",
  "NibliSelfCheck.Scc.dfs_seen_step", "NibliSelfCheck.Scc.dfs_finish_nonroot",
  "NibliSelfCheck.Scc.dfs_finish_root",
  "NibliSelfCheck.Scc.invariant_root_ready", "NibliSelfCheck.Scc.initial_invariant",
  "NibliSelfCheck.Scc.compute_sccs_initialize", "NibliSelfCheck.Scc.invariant_step_total",
  "NibliSelfCheck.Scc.invariant_empty_dfs", "NibliSelfCheck.Scc.invariant_seen_preserved",
  "NibliSelfCheck.Scc.invariant_discover_preserved",
  "NibliSelfCheck.Scc.invariant_nonroot_preserved", "NibliSelfCheck.Scc.invariant_root_preserved",
  "NibliSelfCheck.Scc.invariant_step_preserved",
  "NibliSelfCheck.Scc.dfs_step_decreases", "NibliSelfCheck.Scc.dfs_total",
  "NibliSelfCheck.Scc.start_invariant", "NibliSelfCheck.Scc.scan_step",
  "NibliSelfCheck.Scc.scan_total", "NibliSelfCheck.Scc.compute_sccs_correct",
  "NibliSelfCheck.Scc.dep_path_reaches", "NibliSelfCheck.Scc.reach_eq_or_dep_path",
  "NibliSelfCheck.Scc.neg_path_append", "NibliSelfCheck.Scc.neg_path_iff_marked_edge",
  "NibliSelfCheck.Scc.negative_cycle_iff_return_path",
  "NibliSelfCheck.Scc.partition_negative_cycle_iff",
  "NibliSelfCheck.Scc.compute_sccs_negative_cycle_criterion",
]

[[obligation]]
id = "primitive_strings"
sources = ["proofs/self-check/StdStrings.lean", "nibli-reason/src/rules.rs"]
contract = """Candidate library model contracts for exact UTF-8 byte views,
conversion, cloning, bytewise comparison, and append. Invalid UTF-8 is refused;
byte-vector allocation size is bounded by the target's isize maximum. Model
proofs do not verify Rust std internals or host allocation success, and these
models are not yet installed as extraction replacements."""
probes = ["stratification"]
tests = ["proofs/self-check/test_models.py"]
theorem_files = ["proofs/self-check/StdStrings.lean"]
theorems = [
  "NibliSelfCheck.StdStrings.bytes_length", "NibliSelfCheck.StdStrings.bytes_round_trip",
  "NibliSelfCheck.StdStrings.represents_unique", "NibliSelfCheck.StdStrings.borrow_spec",
  "NibliSelfCheck.StdStrings.from_str_eq", "NibliSelfCheck.StdStrings.from_str_spec",
  "NibliSelfCheck.StdStrings.push_str_spec", "NibliSelfCheck.StdStrings.clone_spec",
  "NibliSelfCheck.StdStrings.equal_spec", "NibliSelfCheck.StdStrings.compare_bytes_spec",
  "NibliSelfCheck.StdStrings.compare_bytes_equal_iff", "NibliSelfCheck.StdStrings.from_str_invalid",
  "NibliSelfCheck.StdStrings.clone_too_large", "NibliSelfCheck.StdStrings.push_str_too_large",
]

[[obligation]]
id = "primitive_maps"
sources = ["proofs/self-check/StdMaps.lean", "nibli-reason/src/rules.rs"]
contract = """Candidate finite-map and iterator contracts: lookup identifies
exactly the stored binding, insertion changes only the selected key and returns
the former value, key uniqueness is preserved, growth matches key absence, and
lookup is independent of enumeration order. These are unbounded list-level
models; binding allocation and representation invariants remains open."""
probes = ["stratification"]
tests = ["proofs/self-check/test_models.py"]
theorem_files = ["proofs/self-check/StdMaps.lean"]
theorems = [
  "NibliSelfCheck.StdMaps.lookup_value_none_iff", "NibliSelfCheck.StdMaps.lookup_value_some_iff",
  "NibliSelfCheck.StdMaps.lookup_eq", "NibliSelfCheck.StdMaps.insert_eq",
  "NibliSelfCheck.StdMaps.put_value_keys", "NibliSelfCheck.StdMaps.put_value_unique",
  "NibliSelfCheck.StdMaps.put_value_lookup", "NibliSelfCheck.StdMaps.put_value_length",
  "NibliSelfCheck.StdMaps.insert_spec", "NibliSelfCheck.StdMaps.next_spec",
  "NibliSelfCheck.StdMaps.lookup_spec", "NibliSelfCheck.StdMaps.lookup_value_order_independent",
]

[[obligation]]
id = "primitive_sets_sort"
sources = ["proofs/self-check/StdSetsSort.lean", "nibli-reason/src/rules.rs"]
contract = """Candidate set and sort contracts: insertion preserves uniqueness,
changes membership only by the inserted item, reports prior absence, and has
exact cardinality growth. Ordered insertion preserves order. Sorting returns a
permutation in comparator order with unchanged length. Comparator success and
ordering laws are explicit preconditions; allocation/binding proofs remain open."""
probes = ["stratification"]
tests = ["proofs/self-check/test_models.py"]
theorem_files = ["proofs/self-check/StdSetsSort.lean"]
theorems = [
  "NibliSelfCheck.StdSetsSort.contains_eq", "NibliSelfCheck.StdSetsSort.set_insert_eq",
  "NibliSelfCheck.StdSetsSort.set_insert_spec", "NibliSelfCheck.StdSetsSort.ordered_insert_eq",
  "NibliSelfCheck.StdSetsSort.sort_eq", "NibliSelfCheck.StdSetsSort.sort_spec",
  "NibliSelfCheck.StdSetsSort.ordered_set_insert_eq", "NibliSelfCheck.StdSetsSort.ordered_set_insert_spec",
]

