# Obligation inventory, not a certificate or an exhaustive call-graph proof.
# Empty theorem lists are deliberate: model proofs and differential tests do
# not establish implementation refinement. Extraction reports bind to source
# hashes; changing this inventory cannot certify the whole engine.
schema = 1
profile = "Fresh CoreSession; default compute registry; strict off; existential import off"
certified_target = "none"
candidate_target = "x86_64-unknown-linux-gnu"
parser_boundary = "All parser-produced ASTs; parsing itself remains trusted"
resource_policy = "Unknown, resource exhaustion, and operational failures are inconclusive"
external_compute_boundary = "Explicit oracle contract required; dispatch/cache/error handling remains a proof obligation"

[[obligation]]
id = "reification"
sources = ["nibli-kr/src/ast.rs", "nibli-kr/src/reify.rs", "nibli-lexicon/src/lib.rs"]
contract = "Lossless ordered syntax, scalar bytes, deterministic serialization, complete committed lexical metadata"
probes = ["reification"]
tests = ["nibli-kr/src/reify.rs", "nibli/tests/ast_cli.rs"]
theorems = []

[[obligation]]
id = "resolution"
sources = ["nibli-kr/src/resolve.rs", "nibli-kr/src/emit.rs"]
contract = "Vocabulary, arity/place routing, bound slots, pronoun collisions, special-term contexts, flavor compatibility"
probes = ["emission"]
tests = ["nibli-kr/src/shape_tests.rs", "nibli-verify/tests/nibli_kr_seam_gate.rs"]
theorems = []

[[obligation]]
id = "lowering"
sources = ["nibli-semantics/src/lib.rs", "nibli-semantics/src/semantic.rs", "nibli-semantics/src/semantic/compile.rs", "nibli-semantics/src/semantic/helpers.rs", "nibli-semantics/src/semantic/predicate.rs"]
contract = "Scope, co-reference, AST/IR validation, event decomposition, all term/claim constructors and query intent"
probes = ["lowering"]
tests = ["nibli-semantics/src/semantic/tests.rs", "nibli-verify/tests/nibli_kr_seam_gate.rs"]
theorems = []

[[obligation]]
id = "quotation_identity"
sources = ["nibli-semantics/src/semantic/predicate.rs", "nibli-types/src/abstraction.rs", "nibli-verify/spec/nibli_checker.nibli"]
contract = "Independent Nibli encoding equals canonical IR bytes, alpha-renaming, numeric bits, FNV digest plus full key, nested quotation opacity"
probes = ["quotation_codec", "lowering"]
tests = ["nibli-semantics/src/semantic/tests/abstractions.rs", "nibli-verify/tests/self_check.rs"]
theorems = []

[[obligation]]
id = "static_ingress"
sources = ["nibli-reason/src/kb.rs", "nibli-reason/src/rules.rs", "nibli-session/src/lib.rs"]
contract = "Derived-only and admitted sets, ordered declarations, assertion/query distinction, representability, unsupported rule shapes, DNF bound, query-only count/compute/comparison guards"
probes = ["assertion"]
tests = ["nibli-reason/src/tests/assertions.rs", "nibli-reason/src/tests/compute_ingest.rs", "nibli-verify/tests/self_check.rs"]
theorems = []

[[obligation]]
id = "stratification"
sources = ["nibli-reason/src/rules.rs", "nibli-reason/src/dependency_graph.rs", "nibli-reason/src/materialize.rs", "nibli-verify/spec/nibli_checker.nibli"]
contract = "Production dependency extraction and SCC traversal equal existence of a valid stratum assignment; negative-edge cycles rejected"
probes = ["stratification", "scc_kernel"]
tests = ["nibli-reason/src/rules.rs", "nibli-verify/src/strat_diff.rs", "nibli-verify/tests/self_check.rs"]
theorems = []

[[obligation]]
id = "scc_stack"
sources = ["nibli-reason/src/dependency_graph.rs"]
contract = "Production component removal terminates at the topmost active root, returns exactly the reversed active suffix, and preserves state entries except the emitted members' stack flags. Under explicit ordered-stack and root-frontier preconditions the emitted list is a maximal SCC without duplicates, the completed set remains forward closed, and remaining stack flags/order and discovery metadata are preserved. Local DFS branch contracts prove exact discovery, visited-edge, root/nonroot completion and empty-stack exit behavior, including arithmetic and buffer bounds. Root completion applies the SCC theorem to actual live and completed buffers. Establishing these preconditions throughout DFS, complete traversal termination/coverage, and the name adapter remain separate obligations."
probes = ["scc_kernel"]
tests = ["nibli-reason/src/dependency_graph.rs", "nibli-reason/src/rules.rs"]
theorem_file = "proofs/self-check/SccKernelProofs.lean"
theorems = [
  "NibliSelfCheck.Scc.pop_done", "NibliSelfCheck.Scc.pop_step",
  "NibliSelfCheck.Scc.pop_component_total", "NibliSelfCheck.Scc.pop_component_scc",
  "NibliSelfCheck.Scc.dfs_done", "NibliSelfCheck.Scc.dfs_discover_step",
  "NibliSelfCheck.Scc.dfs_seen_step", "NibliSelfCheck.Scc.dfs_finish_nonroot",
  "NibliSelfCheck.Scc.dfs_finish_root",
]

[[obligation]]
id = "installation"
sources = ["nibli-session/src/lib.rs", "nibli-reason/src/lib.rs", "nibli-reason/src/kb.rs", "nibli-reason/src/fact_store.rs"]
contract = "Public adapters preserve prepared results, successful installation, atomic refusal, ordered batch and individual assertion agreement"
probes = ["assertion"]
tests = ["nibli-reason/src/tests/lifecycle.rs", "nibli-session/src/lib.rs"]
theorems = []

[[obligation]]
id = "verdict_algebra"
sources = ["nibli-reason/src/reasoning.rs", "nibli-types/src/logic.rs"]
contract = "Conjunction/disjunction/NAF totality, exact definitive cases, indeterminate and resource precedence with preserved reasons"
probes = ["verdicts"]
tests = ["nibli-reason/src/reasoning.rs"]
theorem_file = "proofs/self-check/Verdicts.lean"
theorems = [
  "NibliSelfCheck.conjunction_total", "NibliSelfCheck.disjunction_total",
  "NibliSelfCheck.negation_total", "NibliSelfCheck.conjunction_true_iff",
  "NibliSelfCheck.conjunction_false_iff", "NibliSelfCheck.disjunction_true_iff",
  "NibliSelfCheck.disjunction_false_iff", "NibliSelfCheck.conjunction_true_identity",
  "NibliSelfCheck.disjunction_false_identity", "NibliSelfCheck.resource_precedes_unknown",
  "NibliSelfCheck.indeterminate_reasons_left_biased", "NibliSelfCheck.negation_true_iff",
  "NibliSelfCheck.negation_false_iff", "NibliSelfCheck.negation_preserves_indeterminacy",
]

[[obligation]]
id = "unification_equality"
