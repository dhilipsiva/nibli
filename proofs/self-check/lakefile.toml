name = "nibliSelfCheck"
version = "0.1.0"
defaultTargets = ["Verdicts"]

[[require]]
name = "aeneas"
git = { url = "https://github.com/AeneasVerif/aeneas", subDir = "backends/lean" }
rev = "fdebf20d78e8007bb92fc17068f17fc2e6cfbbbf"

# Generated from the production Rust functions before each proof run.
[[lean_lib]]
name = "Input"
srcDir = "../../target/self-check-proof/probes/verdicts/lean"

[[lean_lib]]
name = "Verdicts"

[[lean_lib]]
name = "SccKernel"
srcDir = "../../target/self-check-proof/probes/scc_kernel/lean"
globs = ["SccKernel.+"]

[[lean_lib]]
name = "SccKernelProofs"

[[lean_lib]]
name = "SccGraph"

[[lean_lib]]
name = "SccInvariant"

[[lean_lib]]
name = "SccTermination"

[[lean_lib]]
name = "SccTraversal"

[[lean_lib]]
name = "SccCriterion"

[[lean_lib]]
name = "StratificationScan"

[[lean_lib]]
name = "StdStrings"

[[lean_lib]]
name = "StdMaps"

[[lean_lib]]
name = "StdSetsSort"

[[lean_lib]]
name = "StdHash"

[[lean_lib]]
name = "StdBounded"

[[lean_lib]]
name = "Stratification"
srcDir = "../../target/self-check-proof/probes/stratification/lean"
globs = ["Stratification.+"]
