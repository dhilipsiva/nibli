[package]
name = "nibli-db"
description = "A nibli-kr-native database: ACID on each replica, CRDT between replicas"
version.workspace = true
rust-version.workspace = true
edition = "2024"
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
nibli-engine = { workspace = true }
nibli-kr = { workspace = true }
redb = "2"
ed25519-dalek = "2"

[features]
default = ["git"]
# The Git transport of roadmap/DB2.md (`src/git.rs`): `git::GitPeer`, a `Peer` on any Git
# remote, driven through the `git` command line. No dependency of its own; off with
# `default-features = false`.
git = []

[dev-dependencies]
tempfile = "3"

[[example]]
name = "git-sync"
required-features = ["git"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
# The deliberately broken builds of roadmap/DB1.md and roadmap/DB2.md (Anti-fake). They are
# never a feature: only `RUSTFLAGS="--cfg nibli_db_broken=\"…\""` reaches them, as
# `just verify-db-broken` does.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nibli_db_broken, values("lww", "nonatomic", "nosig", "force", "onescope", "stale"))'] }
