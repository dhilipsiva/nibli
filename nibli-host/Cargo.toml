[package]
name = "nibli-host"
description = "WASM host runner — Wasmtime REPL with compute backend TCP client"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Tier Z (RELEASING.md): ships via GH Release / repo, never to crates.io.
publish = false

[dependencies]
anyhow = "1.0.101"
reedline = "0.45.0"
nu-ansi-term = "0.50"
wasmtime = { version = "41.0.3", features = ["component-model"] }
wasmtime-wasi = "41.0.3"
nibli-kr = { workspace = true, features = ["reedline"] }
nibli-protocol = { workspace = true, features = ["compute-client"] }
nibli-render = { workspace = true }
nibli-store = { workspace = true }
nibli-types = { workspace = true, features = ["serde"] }
postcard = { version = "1", features = ["alloc"] }

[dev-dependencies]
tempfile = "3"
