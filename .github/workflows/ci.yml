name: CI

on:
  push:
    # Branches only. Naming `branches` at all suppresses TAG pushes, which
    # release.yml now owns — its `gate` job calls this workflow, so a tagged
    # commit still gets the full gate, once instead of twice. '**' matches
    # across slashes, so feat/foo still runs.
    branches: ['**']
  pull_request:
  # release.yml's `gate` job calls this workflow, so the release gate IS the CI
  # gate by construction and the two can never drift.
  workflow_call:

# A newer push to the same branch or pull request cancels the run it supersedes. A tag's gate (called
# from release.yml) is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# A CI build never reuses incremental state, and leaving it out keeps the cached target/ a few GB
# smaller (the cache shares the repository's quota with the Nix cache).
env:
  CARGO_INCREMENTAL: 0

jobs:
  # The native gates (`just ci`), split from the WASM smokes so each finishes inside its hour: the
  # single runtime-ci job took 46 of its 60 minutes when it last passed.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # Cargo's registry, git checkouts and build directory, per job and lockfile (the Nix store is
      # cached by magic-nix-cache above).
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-native-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-native-${{ runner.os }}-

      # nibli-pipeline/src/bindings.rs is auto-generated by `cargo component build -p nibli-pipeline`
      # and gitignored, so it is absent on a fresh checkout. `just build-wasm`
      # regenerates it (and `cargo fmt -p nibli-pipeline` normalizes it) so the later
      # fmt-check + native `test` compile of lasna succeed.
      - name: Generate WIT bindings (lasna)
        run: nix develop --extra-experimental-features 'nix-command flakes' --command just build-wasm

      - name: Native CI gates (just ci)
        run: nix develop --extra-experimental-features 'nix-command flakes' --command just ci

  # The WASM component's smokes (`just ci-wasm`); each recipe builds the component and the host it
  # needs. Parallel to `native`.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: WASM CI gates (just ci-wasm)
        run: nix develop --extra-experimental-features 'nix-command flakes' --command just ci-wasm

  # The declared MSRV (`rust-version`) is the flake-pinned toolchain; this job proves the
  # workspace builds on exactly it.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build on the MSRV
        run: nix develop --extra-experimental-features 'nix-command flakes' --command just msrv-check

  # Supply chain (deny.toml): advisories, bans, licences, sources. Non-blocking while deny.toml
  # ignores open advisories; it becomes blocking when that list is empty, and stays so.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: cargo deny
        run: nix develop --extra-experimental-features 'nix-command flakes' --command cargo deny check advisories bans licenses sources

  # Built-in authorization (nibli-auth + axum example compile). Parallel to
  # the native and WASM gates. The Python bridge has its own `auth-py` job below.
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Auth tests + axum example check
        run: nix develop --extra-experimental-features 'nix-command flakes' --command bash -c 'just test-auth && just check-auth-axum'

  # Python auth bridge (nibli-auth-py via maturin + the pure-Python package's
  # unittest suite). Its own job rather than a step in `auth`: the PyO3 cdylib
  # release build is the long pole on a cold runner and must not serialize
  # behind (or time-box against) the Rust auth leg. maturin + python3 come from
  # the default Nix devshell; the recipe owns its venv (.venv-auth).
  auth-py:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Python auth bridge tests (maturin + unittest)
        run: nix develop --extra-experimental-features 'nix-command flakes' --command just test-auth-py

  # Code-derived mdBook site (`mdbook/`). Parallel to the gates so a docs
  # failure does not wait on the full engine gate. No deploy in this job.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build mdBook (just docs)
        run: nix develop --extra-experimental-features 'nix-command flakes' --command just docs

  # Time-boxed libFuzzer sweep (3 targets × 120 s), parallel to the gates so it
  # never extends their critical path. Corpora are seeded from the
  # shipped .nibli files (+ the nibli KR acceptance corpus); any crash/OOM fails
  # the job.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Fuzz gate (seed + 4 targets, time-boxed)
        run: nix develop --extra-experimental-features 'nix-command flakes' --command just fuzz-ci
