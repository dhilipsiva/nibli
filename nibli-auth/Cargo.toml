[package]
name = "nibli-auth"
description = "Built-in authorization: warm Authorizer over nibli-session (policy once, ephemeral context, decision cache)"
version.workspace = true
rust-version.workspace = true
edition = "2024"
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
axum = ["dep:axum", "dep:serde", "dep:serde_json"]
async-graphql = ["dep:async-graphql"]
juniper = ["dep:juniper"]

[dependencies]
nibli-session = { workspace = true }
nibli-types = { workspace = true, features = ["serde"] }
nibli-protocol = { workspace = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["json", "tokio"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
async-graphql = { version = "7", optional = true, default-features = false }
juniper = { version = "0.16", optional = true, default-features = false }
