[package]
name = "nibli-verify"
description = "Differential soundness gate: check nibli's verdict against Vampire (classical FOL, Horn/NAF-free) and clingo (ASP, stratified-NAF + closed-world)"
version.workspace = true
rust-version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Tier Z (RELEASING.md): a CI gate, never to crates.io.
publish = false

[features]
# The repository's differential suite keeps its exact live corpora by default.
# Downstream static-check consumers can omit repo-root file inclusions when vendoring.
default = ["repo-corpora"]
repo-corpora = []

[dependencies]
nibli-engine = { workspace = true }
nibli-types = { workspace = true }
# The KR front-end + nibli-semantics/logji so nibli_kr_battery::kompile() runs the shipped
# post-parse stages (compute-node marking included).
nibli-kr = { workspace = true }
nibli-semantics = { workspace = true }
nibli-reason = { workspace = true }
nibli-session = { workspace = true }
# The Predilex gates key their Lojban lemmas through the provenance bridge
# (nibli_lexicon::by_provenance) — a regular dep since the taxonomy leg
# (src/lib.rs::run_predilex_taxonomy) re-keys edges to English corpus names;
# the corpus/alias differential tests use the same crate.
nibli-lexicon = { workspace = true }

[dev-dependencies]

[[bin]]
name = "nibli-verify"
path = "src/main.rs"
required-features = ["repo-corpora"]

[lib]
name = "nibli_verify"
path = "src/lib.rs"
