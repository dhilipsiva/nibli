[package]
name = "nibli-render"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Shared human-readable rendering for the Transparency Triad back-translation and proof traces"
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
nibli-types = { workspace = true }
nibli-protocol = { workspace = true }
nibli-lexicon = { workspace = true }

# PATH-ONLY internal dev-deps (see nibli-kr/Cargo.toml): stripped at publish,
# so they impose no publish-order constraint.
[dev-dependencies]
nibli-kr = { path = "../nibli-kr" }
nibli-semantics = { path = "../nibli-semantics" }
