[package]
name = "nibli-engine"
description = "Native engine wrapper library (in-process embedding of the nibli pipeline)"
version.workspace = true
rust-version.workspace = true
edition = "2024"
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
nibli-kr = { workspace = true }
nibli-semantics = { workspace = true }
nibli-session = { workspace = true }
nibli-reason = { workspace = true }
nibli-types = { workspace = true, features = ["serde"] }
nibli-protocol = { workspace = true, features = ["compute-client"] }
nibli-render = { workspace = true }
nibli-store = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"

# PATH-ONLY internal dev-deps (see nibli-kr/Cargo.toml): stripped at publish,
# so they impose no publish-order constraint.
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"
nibli-render = { path = "../nibli-render" }
nibli-protocol = { path = "../nibli-protocol", features = ["compute-client"] }
# Test-only: seed legacy v2 on-disk fixtures (a Text row, a downgraded version
# stamp) for the schema-v3 migration tests. Matches nibli-store's redb version.
redb = "2"

[[bench]]
name = "engine_bench"
harness = false
