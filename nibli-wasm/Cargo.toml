[package]
name = "nibli-wasm"
version.workspace = true
rust-version.workspace = true
edition = "2021"
description = "Browser wasm wrapper — gerna/nibli-semantics/logji + nibli-lexicon behind wasm-bindgen, no persistence. Powers the live Transparency Triad demo at dhilipsiva.dev/nibli."
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Tier Z (RELEASING.md): ships as the site's wasm bundle, never to crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
# The nibli KR front-end — the sole compile path (`set_language` survives as a no-op shim).
nibli-kr = { workspace = true }
nibli-semantics = { workspace = true }
nibli-reason = { workspace = true }
nibli-session = { workspace = true }
nibli-types = { workspace = true }
nibli-protocol = { workspace = true }
nibli-render = { workspace = true }
nibli-lexicon = { workspace = true }
wasm-bindgen = "0.2"
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
